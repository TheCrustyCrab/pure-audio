[package]
name = "pure-audio-wasm"
description = "Adapter for pure-audio processors to run as AudioWorkletNode (Web Audio)"
version = "0.1.0"
edition = "2021"

[dependencies]
js-sys = "0.3.77"
pure-audio = { path = "../pure-audio" }
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.42"
web-sys = { version = "0.3.77", features = [
  "AudioContext",
  "AudioParam",
  "AudioParamMap",
  "AudioWorklet",
  "AudioWorkletGlobalScope",
  "AudioWorkletNode",
  "AudioWorkletNodeOptions",
  "Blob",
  "BlobPropertyBag",
  "ChannelCountMode",
  "console",
  "Document",
  "Element",
  "Event",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlLabelElement",
  "MessagePort",
  "Node",
  'Request', 
  'RequestInit', 
  'RequestMode', 
  'Response', 
  "Url",
  'Window'
] }
