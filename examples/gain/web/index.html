<html>
    <head></head>
    <body>
        <div>
            Volume:
            <input id="volume" type="range" min="0" max="1" step="0.1" value="1" />
        </div>
        <script type="module">
            import init, { create_gain_node } from "./gain.js";

            async function run() {
                document.body.removeEventListener("click", run);

                await init();
                const ctx = new AudioContext();
                const gain = await create_gain_node(ctx);
                const tone = new OscillatorNode(ctx, {
                    frequency: 440
                });
                tone.start();
                tone.connect(gain);
                gain.connect(ctx.destination);
                document.getElementById("volume").addEventListener("change", evt => {
                    gain.parameters.get("Volume").value = parseFloat(evt.target.value);
                })
            }

            document.body.addEventListener("click", run);
        </script>
    </body>
</html>
