<html>
    <head></head>
    <body>
        <div>
            Click anywhere to start
        </div>
        <script type="module">
            import init, { create_gain_node_with_generated_parameter_ui } from "./gain.js";

            async function run() {
                document.body.removeEventListener("click", run);

                await init();
                const ctx = new AudioContext();
                const gain = await create_gain_node_with_generated_parameter_ui(ctx);
                const tone = new OscillatorNode(ctx, {
                    frequency: 440
                });
                tone.start();
                tone.connect(gain);
                gain.connect(ctx.destination);
            }

            document.body.addEventListener("click", run);
        </script>
    </body>
</html>
