<html>
    <head></head>
    <body>
        <div>
            Pan:
            <input id="pan" type="range" min="0" max="1" step="0.1" value="0.5" />
        </div>
        <script type="module">
            import init, { create_pan_node } from "./pan.js";

            async function run() {
                document.body.removeEventListener("click", run);

                await init();
                const ctx = new AudioContext();
                const pan = await create_pan_node(ctx);
                const tone = new OscillatorNode(ctx, {
                    frequency: 440
                });
                tone.start();
                tone.connect(pan);
                pan.connect(ctx.destination);
                document.getElementById("pan").addEventListener("change", evt => {
                    pan.parameters.get("Pan").value = parseFloat(evt.target.value);
                })
            }

            document.body.addEventListener("click", run);
        </script>
    </body>
</html>
