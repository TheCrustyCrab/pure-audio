<html>
    <head></head>
    <body>
        <div>
            Click anywhere to start
        </div>
        <div id="parameters"></div>
        <script type="module">
            import init, { createAudioNodeWithGeneratedParameterUI } from "./pan.js";

            async function run() {
                document.body.removeEventListener("click", run);

                await init();
                const ctx = new AudioContext();
                const pan = await createAudioNodeWithGeneratedParameterUI(ctx, document.getElementById("parameters"));
                const tone = new OscillatorNode(ctx, {
                    frequency: 440
                });
                tone.start();
                tone.connect(pan);
                pan.connect(ctx.destination);
            }

            document.body.addEventListener("click", run);
        </script>
    </body>
</html>
